name: Build and push RunPod worker image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # No GHA cache: writing these large ML-dependency layers to the
          # Actions cache backend took over an hour and then failed on an
          # expired SAS token (the actual build+push itself finishes in a
          # few minutes without it). Docker's own layer cache on the runner
          # already helps across pushes within a run's cache lifetime.
